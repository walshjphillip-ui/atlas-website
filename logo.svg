<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aGrad" x1="50" y1="22" x2="50" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Orbital ring -->
  <circle cx="50" cy="50" r="36" stroke="url(#ringGrad)" stroke-width="1.8"/>

  <!-- Orbital dots — left and right on the ring -->
  <circle cx="14" cy="50" r="3.2" fill="#6d28d9"/>
  <circle cx="86" cy="50" r="3.2" fill="#6d28d9"/>

  <!-- 4-pointed star at the top of the ring -->
  <path d="M50 9 L51.6 13.2 L56 14.5 L51.6 15.8 L50 20 L48.4 15.8 L44 14.5 L48.4 13.2 Z" fill="#ddd6fe"/>

  <!-- A / arrow shape -->
  <path d="M50 23 L77 68 L62 68 L50 48 L38 68 L23 68 Z" fill="url(#aGrad)"/>

  <!-- Right-side shadow for depth -->
  <path d="M50 23 L77 68 L62 68 L50 48 Z" fill="#1e1b4b" opacity="0.28"/>
</svg>
